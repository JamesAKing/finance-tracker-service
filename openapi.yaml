openapi: 3.1.0
info:
  title: Finance Tracker API
  version: 0.1.0
  description: Contract for the Finance Tracker service. Hand-written and the source of truth.
  license:
    name: ISC
    identifier: ISC

servers:
  - url: /api

tags:
  - name: health
    description: Liveness and readiness checks for Docker, load balancers and monitors
  - name: auth
    description: Login through Keycloak and the current session

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check the service is running
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is up. Does not check dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "400":
          $ref: "#/components/responses/BadRequest"

  /health/ready:
    get:
      operationId: getReadiness
      summary: Check the service can handle requests
      tags: [health]
      security: []
      responses:
        "200":
          description: The database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: The database is unreachable. Details are logged, not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable

  /auth/login:
    get:
      operationId: login
      summary: Start a login through Keycloak
      description: Browser navigation, not a fetch call. Sets the short-lived auth_flow cookie.
      tags: [auth]
      security: []
      responses:
        "302":
          description: Redirect to Keycloak's authorization endpoint
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/callback:
    get:
      operationId: loginCallback
      summary: Finish a login and start a session
      description: Keycloak redirects the browser here. Sets the session cookie on success.
      tags: [auth]
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: session_state, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
        - { name: error_uri, in: query, schema: { type: string } }
      responses:
        "302":
          description: Redirect to the app, with `?login=failed` if the login didn't complete
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user
      description: A 401 means there is no valid session; the client should send the browser to /auth/login.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      summary: Logs out the user
      description:
        Browser form post, not a fetch call. Ends the session if there is one and clears the
        session cookie. Always succeeds, with or without a session.
      tags: [auth]
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                _csrf:
                  type: string
                  description:
                    The CSRF token, when the form cannot send the X-CSRF-Token header. Not marked as
                    required here, so a missing token gives 403, not 400
      responses:
        "302":
          description:
            Redirect to Keycloak's end-session endpoint when a session was found, which then
            returns the browser to the app. Redirect straight to the app when there was none
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get a CSRF token
      description:
        Call before any POST, PUT, PATCH or DELETE and send the token in the X-CSRF-Token header
        (or the _csrf form field for logout). Returns the existing token when the browser already
        has one, so open tabs share it. Sign-in and sign-out clear it, so fetch a new one after
        either.
      tags: [auth]
      security: []
      responses:
        "200":
          description:
            The CSRF token. Also sets it in the HttpOnly __Host-csrf cookie the server checks it
            against
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Opaque session token set by /auth/callback. HttpOnly, so JavaScript never sees it.

  schemas:
    CurrentUser:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email

    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken:
          type: string

    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]

    Problem:
      type: object
      description: RFC 9457 Problem Details
      additionalProperties: false
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  headers:
    Location:
      schema:
        type: string
        format: uri

  responses:
    BadRequest:
      description: The request doesn't match the contract
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Bad Request
            status: 400
            detail: "Unknown query parameter 'unexpected'"

    Unauthorized:
      description: No valid session
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Unauthorized
            status: 401
            detail: Not authenticated

    Forbidden:
      description: The CSRF token is missing or doesn't match
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Forbidden
            status: 403
            detail: Invalid CSRF token
