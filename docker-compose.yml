services:
  finance-tracker-service-db:
    image: postgres:17-alpine
    container_name: finance-tracker-service-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - finance_tracker_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-finance_tracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  liquibase:
    build:
      context: ./db
      dockerfile: Dockerfile.liquibase
    image: finance-tracker-liquibase
    profiles: ["tools"]
    depends_on:
      finance-tracker-service-db:
        condition: service_healthy
    volumes:
      - ./db/changelog:/liquibase/changelog
    # Connection settings live in env vars so `docker compose run liquibase <command>` can swap the action
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://finance-tracker-service-db:5432/${POSTGRES_DB:-finance_tracker}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-password}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
    command: update

  finance-tracker-service:
    build: .
    image: finance-tracker-service
    container_name: finance-tracker-service
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@finance-tracker-service-db:5432/${POSTGRES_DB:-finance_tracker}
      OIDC_INTERNAL_URL: http://keycloak:8080
    ports:
      - "3000:3000"
    depends_on:
      finance-tracker-service-db:
        condition: service_healthy
    networks:
      - default
      - finance-tracker

networks:
  finance-tracker:
    external: true

volumes:
  finance_tracker_service_db_data:
