openapi: 3.1.0
info:
  title: Finance Tracker API
  version: 0.1.0
  description: Contract for the Finance Tracker service. Hand-written and the source of truth.
  license:
    name: ISC
    identifier: ISC

servers:
  - url: /api

tags:
  - name: health
    description: Liveness and readiness checks for Docker, load balancers and monitors

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check the service is running
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is up. Does not check dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"

  /health/ready:
    get:
      operationId: getReadiness
      summary: Check the service can handle requests
      tags: [health]
      security: []
      responses:
        "200":
          description: The database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "503":
          description: The database is unreachable. Details are logged, not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable

components:
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]

    Problem:
      type: object
      description: RFC 9457 Problem Details
      additionalProperties: false
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    Unauthorized:
      description: No valid session
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Unauthorized
            status: 401
            detail: Not authenticated
