name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Skip installing Git hooks on the CI machine
      HUSKY: "0"
      # Matches the defaults in docker-compose.yml (host port 5434)
      DATABASE_URL: postgres://postgres:password@localhost:5434/finance_tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:api
      - run: npm run fmt:check
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

      # Reuse the project's compose file; --wait blocks until the healthcheck passes
      - run: docker compose up -d --wait finance-tracker-service-db
      - run: docker compose run --rm liquibase
      - run: npm run test:integration

  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: db/Dockerfile.liquibase

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - run: npm audit --omit=dev --audit-level=high
