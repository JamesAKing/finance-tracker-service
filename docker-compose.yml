services:
  finance-tracker-service-db:
    image: postgres:17-alpine
    container_name: finance-tracker-service-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
    ports:
      - "5434:5432"
    volumes:
      - finance_tracker_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance_tracker}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finance_tracker_service_db_data:
